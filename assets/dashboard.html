:root {
  --bg: #0c0f0e;
  --panel: #121615;
  --raise: #181d1c;
  --line: #222927;
  --line-strong: #2f3835;
  --fg: #dbe3df;
  --fg-dim: #a4b0ab;
  --muted: #7f8c87;
  --running: #5fd38d;
  --waiting: #f0b429;
  --failed: #f26b5e;
  --idle: #7fa9d6;
  --done: #8f9c97;
  --accent: var(--running);
  --heat-0: #171c1b;
  --heat-1: #1d3a2a;
  --heat-2: #2a5d3f;
  --heat-3: #3d8a5b;
  --heat-4: #5fd38d;
  --sans: "Plex Cond", "JetBrainsMono Nerd Font Propo", system-ui, sans-serif;
  --mono: "JBM", "JetBrainsMono Nerd Font Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; }
::selection { background: #2f6b48; color: #f2fff7; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--fg); text-underline-offset: 3px; }
.num, time, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .86em; }

/* ---------- top bar ---------- */
header.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 20px;
  height: 48px; padding: 0 24px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.wordmark { font-weight: 600; letter-spacing: -.01em; font-size: 17px; }
.wordmark span { color: var(--muted); font-weight: 400; }
.hostinfo { color: var(--fg-dim); }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--fg-dim); font-size: 13px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn[data-state="live"] i { background: var(--running); box-shadow: 0 0 0 3px color-mix(in srgb, var(--running) 22%, transparent); }
.conn[data-state="down"] i { background: var(--failed); }
.conn[data-state="down"] { color: var(--failed); }

/* ---------- layout ---------- */
main {
  display: grid; gap: 28px 32px;
  grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr);
  grid-template-areas: "now fleet" "table table";
  padding: 28px 24px 64px; max-width: 1680px; margin: 0 auto;
}
#now { grid-area: now; }
#fleet { grid-area: fleet; }
#table { grid-area: table; }
section > h2 {
  display: flex; align-items: baseline; gap: 14px;
  margin: 0 0 12px; font-size: 19px; font-weight: 600; letter-spacing: -.015em;
}
section > h2 small { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }

/* ---------- status vocabulary ---------- */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.st svg { width: 12px; height: 12px; flex: none; }
.st[data-s="running"] { color: var(--running); }
.st[data-s="waiting"] { color: var(--waiting); }
.st[data-s="failed"]  { color: var(--failed); }
.st[data-s="idle"]    { color: var(--idle); }
.st[data-s="done"]    { color: var(--done); }

.tally { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 14px; font-size: 14px; }
.tally .st { font-size: 14px; }
.tally b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.tally .zero { opacity: .45; }

/* ---------- now board ---------- */
.board { border-top: 1px solid var(--line); }
.row {
  display: grid; align-items: center; gap: 4px 16px;
  grid-template-columns: 112px minmax(0, 1fr) auto;
  width: 100%; padding: 11px 12px; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer;
}
.row:hover { background: var(--raise); }
.row[data-s="waiting"] { background: color-mix(in srgb, var(--waiting) 7%, transparent); }
.row[data-s="waiting"]:hover { background: color-mix(in srgb, var(--waiting) 12%, transparent); }
.row[data-s="failed"] { background: color-mix(in srgb, var(--failed) 7%, transparent); }
.row .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { grid-column: 2; display: flex; gap: 14px; color: var(--muted); font-size: 13px; overflow: hidden; white-space: nowrap; }
.row .meta > * { overflow: hidden; text-overflow: ellipsis; }
.row .since { grid-row: 1 / span 2; grid-column: 3; text-align: right; color: var(--fg-dim); }
.row .since small { display: block; color: var(--muted); font-family: var(--sans); font-size: 12px; }
.row .st { grid-row: 1 / span 2; }
.row[data-s="running"] { --sc: var(--running); } .row[data-s="waiting"] { --sc: var(--waiting); }
.row[data-s="failed"] { --sc: var(--failed); } .row[data-s="idle"] { --sc: var(--idle); } .row[data-s="done"] { --sc: var(--done); }
.row.changed { animation: sweep 1.8s var(--ease); }
@keyframes sweep { from { background-color: color-mix(in srgb, var(--sc) 26%, transparent); } }
@media (prefers-reduced-motion: reduce) { .row.changed { animation: none; } }
.empty { padding: 28px 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.empty strong { color: var(--fg-dim); font-weight: 500; }

/* ---------- fleet ---------- */
.stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px 16px; margin: 0 0 22px; padding: 14px 0; border-block: 1px solid var(--line); }
.stats dt { color: var(--muted); font-size: 12.5px; }
.stats dd { margin: 0; font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; }
.fleet-block { margin-bottom: 24px; }
.fleet-block h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--fg-dim); display: flex; justify-content: space-between; }
.fleet-block h3 span { font-weight: 400; color: var(--muted); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 2px; background: var(--heat-0); }
.heat i[data-l="1"] { background: var(--heat-1); }
.heat i[data-l="2"] { background: var(--heat-2); }
.heat i[data-l="3"] { background: var(--heat-3); }
.heat i[data-l="4"] { background: var(--heat-4); }
.heat i.future { background: transparent; }
.heat i[data-k]:hover { outline: 1px solid var(--fg-dim); outline-offset: 1px; }
.heat span { align-self: center; padding-right: 4px; color: var(--muted); font-size: 10.5px; line-height: 1; opacity: .7; }
.heat-legend { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 12px; }
.heat-wrap { position: relative; }
.heat-tip {
  position: absolute; z-index: 4; pointer-events: none; width: max-content; min-width: 190px; max-width: 280px;
  padding: 8px 10px; background: var(--raise); border: 1px solid var(--line-strong); border-radius: 4px;
  box-shadow: 0 10px 28px -10px rgba(0,0,0,.7); font-size: 13px;
}
.heat-tip b { display: block; font-weight: 600; }
.heat-tip .sum { color: var(--fg-dim); }
.heat-tip .grp { margin-top: 7px; color: var(--muted); font-size: 11.5px; }
.heat-tip dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 14px; margin: 1px 0 0; }
.heat-tip dt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heat-tip dd { margin: 0; text-align: right; color: var(--fg-dim); font-family: var(--mono); font-size: .86em; font-variant-numeric: tabular-nums; }
.heat-tip .more { padding: 0; color: var(--muted); font-size: 12px; }
.bars { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto auto; gap: 6px 12px; align-items: center; font-size: 14px; }
.bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { height: 6px; background: var(--heat-0); border-radius: 1px; overflow: hidden; }
.bars .track i { display: block; height: 100%; background: var(--fg-dim); }
.bars .num { color: var(--fg-dim); text-align: right; }
.bars .num.cost { color: var(--muted); min-width: 6ch; }
.bars button { all: unset; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars button:hover { text-decoration: underline; text-underline-offset: 3px; }
.bars button:focus-visible { outline: 2px solid var(--accent); }

/* ---------- table ---------- */
form.query { display: flex; gap: 8px; margin: 0 0 12px; }
form.query input {
  flex: 1; min-width: 0; padding: 8px 12px;
  font-family: var(--mono); font-size: 13.5px;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 4px; caret-color: var(--accent);
}
form.query input::placeholder { color: var(--muted); }
form.query input:focus { border-color: var(--accent); outline: none; }
form.query select, form.query button {
  padding: 8px 12px; background: var(--raise); border: 1px solid var(--line-strong); border-radius: 4px; cursor: pointer;
}
form.query button { font-weight: 600; }
form.query button:hover, form.query select:hover { border-color: var(--fg-dim); }
.qerr { margin: -4px 0 12px; color: var(--failed); font-size: 13.5px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
th[data-k] { cursor: pointer; user-select: none; }
th[data-k]:hover { color: var(--fg); }
th[aria-sort] { color: var(--fg); }
th[aria-sort="descending"]::after { content: " ↓"; }
th[aria-sort="ascending"]::after { content: " ↑"; }
th.r, td.r { text-align: right; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--raise); }
td .t { max-width: 56ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td .w { color: var(--muted); font-size: 12.5px; max-width: 56ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.dim { color: var(--fg-dim); }
td .none { color: var(--line-strong); }
.more { padding: 12px 10px; color: var(--muted); font-size: 13px; }

/* ---------- transcript drawer ---------- */
aside.drawer {
  position: fixed; inset: 0 0 0 auto; z-index: 10; width: min(780px, 100vw);
  display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--line-strong);
  box-shadow: -24px 0 48px -12px rgba(0,0,0,.55);
  transform: translateX(0); transition: transform .35s var(--ease), visibility 0s;
}
aside.drawer[hidden] { display: flex; visibility: hidden; transform: translateX(100%); transition: transform .3s var(--ease), visibility 0s .3s; }
.dhead { padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
.dhead .top { display: flex; gap: 12px; align-items: start; }
.dhead h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; flex: 1; }
.iconbtn { flex: none; display: grid; place-items: center; width: 30px; height: 30px; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--fg-dim); }
.iconbtn:hover { border-color: var(--line-strong); color: var(--fg); }
.iconbtn svg { width: 16px; height: 16px; }
.dmeta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.dmeta .mono { color: var(--fg-dim); }
.dtools { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--fg-dim); }
.dtools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.dtools input { accent-color: var(--accent); }
.dbody { flex: 1; overflow-y: auto; padding: 8px 20px 40px; overscroll-behavior: contain; }
.turn { padding: 14px 0; border-bottom: 1px solid var(--line); }
.turn-h { display: flex; gap: 12px; align-items: baseline; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.turn-h b { font-weight: 600; color: var(--fg-dim); }
.turn[data-role="user"] .turn-h b { color: var(--waiting); }
.turn[data-role="assistant"] .turn-h b { color: var(--running); }
.md { overflow-wrap: anywhere; max-width: 75ch; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md + .md { margin-top: 10px; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md .tbl { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4, .md h5, .md h6 { font-size: 14px; color: var(--fg-dim); }
.md ul, .md ol { padding-left: 22px; } .md li > ul, .md li > ol, .md li > p { margin: 2px 0; }
.md li::marker { color: var(--muted); }
.md code { font: 12.5px var(--mono); background: var(--raise); padding: 1px 4px; border-radius: 3px; }
.md pre { padding: 10px 12px; overflow: auto; background: var(--bg); border-radius: 4px; }
.md pre code { display: block; padding: 0; background: none; font: 12px/1.5 var(--mono); white-space: pre; }
.md blockquote { padding: 0 0 0 12px; border-left: 2px solid var(--line-strong); color: var(--fg-dim); }
.md hr { border: 0; border-top: 1px solid var(--line-strong); margin: 14px 0; }
.md a[href] { color: var(--idle); }
.md img { max-width: 100%; height: auto; border-radius: 4px; }
.md details { margin: 0 0 10px; } .md summary { cursor: pointer; }
.md kbd { font: 12px var(--mono); padding: 1px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 3px; }
.md mark { background: var(--waiting); color: var(--bg); padding: 0 2px; }
.md .tbl { overflow-x: auto; }
.md table { width: auto; border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line-strong); padding: 4px 8px; text-align: left; vertical-align: top; white-space: normal; }
.md [align="right"] { text-align: right; } .md [align="center"] { text-align: center; }
.md th { font-weight: 600; font-size: 13px; color: var(--fg); background: var(--raise); }
.md tbody tr { cursor: auto; } .md tbody tr:hover { background: none; }
.think { color: var(--muted); font-style: italic; font-size: 14px; }
.call { font-family: var(--mono); font-size: 12.5px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 0; }
.call b { color: var(--idle); font-weight: 600; }
.call.bad b { color: var(--failed); }
details.res { font-size: 12.5px; }
details.res summary { cursor: pointer; font-family: var(--mono); color: var(--muted); padding: 1px 0; list-style-position: inside; }
details.res summary .bad { color: var(--failed); }
details.res pre { margin: 6px 0 8px; padding: 10px 12px; max-height: 360px; overflow: auto; background: var(--bg); border-radius: 4px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.patch { font-family: var(--mono); font-size: 12.5px; color: var(--fg-dim); }
.patch .a { color: var(--running); } .patch .d { color: var(--failed); }
.dbody.no-think .b-thinking, .dbody.no-tools .b-tool, .dbody.no-tools .turn[data-role="tool"] { display: none; }
.dstatus { padding: 32px 0; color: var(--muted); }
.dstatus.err { color: var(--failed); }

@media (max-width: 960px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "now" "fleet" "table"; padding: 20px 14px 48px; }
  header.bar { padding: 0 14px; gap: 12px; }
  .hostinfo { display: none; }
  .row { grid-template-columns: 92px minmax(0, 1fr) auto; padding: 10px 6px; gap: 2px 10px; }
  .hide-sm { display: none; }
  .stats { grid-template-columns: repeat(2, auto); }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wordmark">llm-sessions <span>overview</span></div>
  <div class="hostinfo mono" id="hostinfo"></div>
  <div class="conn" id="conn" data-state="connecting" role="status"><i></i><span>connecting</span></div>
</header>

<main>
  <section id="now" aria-labelledby="now-h">
    <h2 id="now-h">Now <small id="now-sub">live sessions and anything written in the last hour</small></h2>
    <div class="tally" id="tally"></div>
    <div class="board" id="board"><div class="empty">Waiting for the first snapshot…</div></div>
  </section>

  <section id="fleet" aria-labelledby="fleet-h">
    <h2 id="fleet-h">Fleet <small id="fleet-sub"></small></h2>
    <dl class="stats" id="stats"></dl>
    <div class="fleet-block">
      <h3>Sessions started per day <span id="heat-range"></span></h3>
      <div class="heat-wrap"><div class="heat" id="heat"></div><div class="heat-tip" id="heat-tip" role="tooltip" hidden></div></div>
      <div class="heat-legend"><span id="heat-from"></span><span id="heat-max"></span></div>
    </div>
    <div class="fleet-block">
      <h3>By agent <span>sessions · cost</span></h3>
      <div class="bars" id="agents"></div>
    </div>
    <div class="fleet-block">
      <h3>Busiest workspaces <span>last 7 days</span></h3>
      <div class="bars" id="workspaces"></div>
    </div>
  </section>

  <section id="table" aria-labelledby="table-h">
    <h2 id="table-h">Sessions <small id="table-sub"></small></h2>
    <form class="query" id="qform">
      <input id="q" name="q" autocomplete="off" spellcheck="false" aria-label="List query"
             placeholder="agent:codex  ws:cstm  after:7d  cost:>1  live:yes  free words">
      <select id="limit" aria-label="Row limit">
        <option value="100">100 rows</option>
        <option value="500">500 rows</option>
        <option value="0">all rows</option>
      </select>
      <button type="submit">Run query</button>
    </form>
    <div class="qerr" id="qerr" hidden></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="updated" aria-sort="descending">Updated</th>
          <th data-k="source">Agent</th>
          <th data-k="title">Session</th>
          <th data-k="model" class="hide-sm">Model</th>
          <th data-k="out" class="r hide-sm">Output tok</th>
          <th data-k="cost" class="r">Cost</th>
          <th data-k="size" class="r hide-sm">Size</th>
          <th data-k="status">Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" hidden aria-labelledby="d-title">
  <div class="dhead">
    <div class="top">
      <h2 id="d-title"></h2>
      <button class="iconbtn" id="d-close" aria-label="Close transcript">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
      </button>
    </div>
    <div class="dmeta" id="d-meta"></div>
    <div class="dtools">
      <label><input type="checkbox" id="d-think"> thinking</label>
      <label><input type="checkbox" id="d-tools" checked> tool calls</label>
    </div>
  </div>
  <div class="dbody no-think" id="d-body"></div>
</aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v; // only used with constant SVG markup
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

// ---------- formatting ----------
const STATUS_ORDER = { waiting: 0, failed: 1, running: 2, idle: 3, done: 4 };
const ICON = {
  running: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="currentColor"/></svg>',
  waiting: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 1.5l4.8 8.6H1.2z"/><path d="M6 5v2.2" stroke-linecap="round"/></svg>',
  failed:  '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/><path d="M4.2 4.2l3.6 3.6M7.8 4.2l-3.6 3.6"/></svg>',
  idle:    '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="4"/></svg>',
  done:    '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3l2.6 2.6L10 3.3"/></svg>',
};
function statusOf(row) { return row.status && row.status.status || null; }
function statusEl(s, reason) {
  if (!s) return h("span", { class: "none" }, "—");
  return h("span", { class: "st", "data-s": s }, h("span", { html: ICON[s] || ICON.idle, style: "display:contents" }), reason ? `${s} · ${reason}` : s);
}
function ago(iso, now = Date.now()) {
  if (!iso) return "—";
  const s = Math.max(0, (now - Date.parse(iso)) / 1000);
  if (s < 45) return "now";
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m`.replace(/ 0m$/, "");
  if (s < 86400 * 30) return `${Math.round(s / 86400)}d`;
  return new Date(iso).toLocaleDateString(undefined, { year: "2-digit", month: "short", day: "numeric" });
}
const absTime = (iso) => iso ? new Date(iso).toLocaleString() : "";
function compact(n) {
  if (n == null) return null;
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + "k";
  return (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + "M";
}
function money(c) {
  if (!c) return null;
  if (c < 0.01) return "<$0.01";
  if (c < 100) return "$" + c.toFixed(2);
  return "$" + Math.round(c).toLocaleString();
}
function bytes(n) {
  if (n == null) return null;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
const base = (p) => p ? p.replace(/\/+$/, "").split("/").pop() || p : "—";
const short = (p) => p ? p.replace(/^\/home\/[^/]+/, "~") : "—";
const rowKey = (r) => `${r.origin_id || ""}/${r.source}/${r.id}`;
const none = () => h("span", { class: "none" }, "—");

// Served by `llm-sessions serve --dashboard`; the API is this page's origin.
// Open it once with #token=TOKEN: the token is kept in localStorage and the
// fragment cleared from the address bar. A `--no-auth` server needs none.
const token = (() => {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("token")) localStorage.setItem("llms-token", p.get("token"));
  if (p.has("token")) history.replaceState(null, "", location.pathname + location.search);
  return localStorage.getItem("llms-token") || "";
})();
let rejected = false;           // the server refused the token: stop polling
async function api(path) {
  const res = await fetch(path, { cache: "no-store", headers: token ? { authorization: `Bearer ${token}` } : {} });
  const text = await res.text();
  let body; try { body = JSON.parse(text); } catch { body = text; }
  if (res.status === 401) {
    rejected = true;
    setConn("down", `${token ? "token rejected" : "token required"} · open this page with #token=…`);
  }
  if (!res.ok) throw new Error((body && body.error) || text || `HTTP ${res.status}`);
  return body;
}

// ---------- connection indicator ----------
function setConn(state, label) {
  const c = $("conn"); c.dataset.state = state; c.querySelector("span").textContent = label;
}

// ---------- now board (WebSocket) ----------
let lastStatus = null;        // key -> status of the previous snapshot; null before the first
let watched = [];
function renderNow() {
  const now = Date.now();
  const rows = watched.filter((r) => statusOf(r)).sort((a, b) =>
    (STATUS_ORDER[statusOf(a)] ?? 9) - (STATUS_ORDER[statusOf(b)] ?? 9) ||
    Date.parse(b.updated) - Date.parse(a.updated));
  const counts = { waiting: 0, failed: 0, running: 0, idle: 0, done: 0 };
  for (const r of rows) counts[statusOf(r)] = (counts[statusOf(r)] || 0) + 1;
  $("tally").replaceChildren(...Object.entries(counts).map(([s, n]) =>
    h("span", { class: n ? "" : "zero" }, h("span", { class: "st", "data-s": s }, h("span", { html: ICON[s], style: "display:contents" }), h("b", {}, n), s))));
  document.title = counts.waiting ? `(${counts.waiting} waiting) llm-sessions` : "llm-sessions";

  const next = new Map(rows.map((r) => [rowKey(r), statusOf(r)]));
  const board = $("board");
  if (!rows.length) {
    board.replaceChildren(h("div", { class: "empty" }, h("strong", {}, "Nothing running."), " No live session and nothing written in the last hour."));
  } else {
    board.replaceChildren(...rows.map((r) => {
      const s = statusOf(r);
      const changed = lastStatus && lastStatus.get(rowKey(r)) !== s;
      const pid = r.liveness && r.liveness.pid;
      return h("button", { class: "row" + (changed ? " changed" : ""), "data-s": s, onclick: () => openTranscript(r) },
        statusEl(s, r.status.waitingReason),
        h("div", { class: "title", title: r.title || r.id }, r.title || r.id),
        h("div", { class: "meta" },
          h("span", { title: r.workspace }, base(r.workspace)),
          h("span", {}, r.source),
          r.model && h("span", {}, r.model),
          r.branch && h("span", { class: "hide-sm" }, r.branch),
          pid && h("span", { class: "mono hide-sm" }, "pid " + pid)),
        h("div", { class: "since" }, h("time", { datetime: r.status.statusSince, title: absTime(r.status.statusSince) }, ago(r.status.statusSince, now)), h("small", {}, "in state")));
    }));
  }
  lastStatus = next;
}

let backoff = 1000;
function connectStream() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/v1/stream${token ? "?token=" + encodeURIComponent(token) : ""}`);
  ws.onopen = () => { backoff = 1000; setConn("live", "stream live"); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type !== "snapshot") return;
    watched = msg.sessions || [];
    renderNow();
  };
  ws.onclose = () => {
    if (rejected) return;
    setConn("down", `stream lost · retrying in ${Math.round(backoff / 1000)}s`);
    setTimeout(connectStream, backoff);
    backoff = Math.min(backoff * 2, 30000);
  };
}
setInterval(() => watched.length && renderNow(), 30000); // keep "in state" ages fresh

// ---------- fleet (full listing) ----------
let fleetRows = [];
function dayKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

// heatmap hover details; heatDays is rebuilt by renderFleet
let heatDays = new Map(), heatCell = null;
const heatDate = (d) => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
function tipList(label, map, fmt, limit) {
  const list = [...map].sort((a, b) => b[1] - a[1]);
  const shown = list.slice(0, limit), rest = list.length - shown.length;
  return [
    h("div", { class: "grp" }, label),
    h("dl", {}, ...shown.flatMap(([k, n]) => [h("dt", { title: k }, fmt(k)), h("dd", {}, n)])),
    ...(rest > 0 ? [h("div", { class: "more" }, `+${rest} more`)] : []),
  ];
}
function showHeatTip(cell) {
  const tip = $("heat-tip");
  const [y, m, dd] = cell.dataset.k.split("-").map(Number);
  const d = heatDays.get(cell.dataset.k);
  const head = h("b", {}, new Date(y, m - 1, dd).toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "short", day: "numeric" }));
  if (!d) tip.replaceChildren(head, h("div", { class: "sum" }, "No sessions started"));
  else tip.replaceChildren(head,
    h("div", { class: "sum" }, [`${d.n} session${d.n === 1 ? "" : "s"}`, d.out && `${compact(d.out)} out`, money(d.cost)].filter(Boolean).join(" · ")),
    ...tipList("agents", d.agents, (k) => k, 4),
    ...tipList("workspaces", d.ws, base, 3));
  heatCell = cell;
  tip.hidden = false;
  const wrap = tip.parentElement.getBoundingClientRect(), c = cell.getBoundingClientRect();
  const left = Math.min(Math.max(0, c.left - wrap.left + c.width / 2 - tip.offsetWidth / 2), wrap.width - tip.offsetWidth);
  let top = c.top - wrap.top - tip.offsetHeight - 8;
  if (wrap.top + top < 56) top = c.bottom - wrap.top + 8; // keep clear of the sticky header
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
}
$("heat").addEventListener("mouseover", (e) => { const c = e.target.closest("i[data-k]"); if (c && c !== heatCell) showHeatTip(c); });

    }
    if (tag === "IMG") {
      const src = el.getAttribute("src") || "", alt = el.getAttribute("alt") || "";
      if (embeddedImage(src)) el.decoding = "async";
      else if (/^https?:/i.test(src.trim())) el.replaceWith(h("a", { href: src, target: "_blank", rel: "noopener noreferrer", title: src }, `[image: ${alt || src}]`));
      else el.replaceWith(alt);
    }
  }
}
function renderMarkdown(src, cls = "") {
  const tpl = document.createElement("template");   // inert: nothing runs or loads while parsing
  tpl.innerHTML = mdBlocks(src.replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n"));
  sanitize(tpl.content);
  const el = h("div", { class: `md ${cls}`.trim() });
  el.append(document.importNode(tpl.content, true));
  return el;
}

function renderBlock(b) {
  switch (b.block) {
    case "text": return renderMarkdown(b.text || "");
    case "thinking": return renderMarkdown(b.text || "", "think b-thinking");
    case "toolcall": return h("div", { class: "call b-tool", title: JSON.stringify(b.input, null, 1).slice(0, 2000) }, h("b", {}, b.name), "  ", toolSummary(b.input).replace(/\s+/g, " "));
    case "toolresult": {
      const out = typeof b.output === "string" ? b.output : JSON.stringify(b.output, null, 1);
      const pre = h("pre", {});
      const d = h("details", { class: "res b-tool" }, h("summary", {}, b.ok === false ? h("span", { class: "bad" }, `${b.name} failed`) : `${b.name} result`, ` · ${(out || "").length.toLocaleString()} chars`), pre);
      d.addEventListener("toggle", () => { if (d.open && !pre.textContent) pre.textContent = out.length > 20000 ? out.slice(0, 20000) + "\n… truncated" : out; }, { once: false });
      return d;
    }
    case "patch": return h("div", { class: "patch b-tool" }, b.summary, " ", ...(b.files || []).map((f) => h("div", {}, "  ", short(f.path), " ", h("span", { class: "a" }, `+${f.added}`), " ", h("span", { class: "d" }, `-${f.deleted}`))));
    case "image": return h("div", { class: "call" }, "[image] ", b.label || "");
    default: return h("div", { class: "call" }, `[${b.block}]`);
  }
}
async function openTranscript(r) {
  const key = rowKey(r); openKey = key;
  lastFocus = document.activeElement;
  const dr = $("drawer"); dr.hidden = false;
  $("d-title").textContent = r.title || r.id;
  const u = r.usage || {};
  $("d-meta").replaceChildren(...[
    h("span", {}, r.source), r.model && h("span", {}, r.model),
    h("span", { title: r.workspace }, short(r.workspace)),
    r.branch && h("span", {}, r.branch),
    h("span", { class: "mono", title: "session id" }, r.id),
    money(u.cost) && h("span", { class: "mono" }, money(u.cost)),
    h("span", {}, "updated ", h("time", { title: absTime(r.updated) }, ago(r.updated))),
  ].filter(Boolean));
  const body = $("d-body");
  body.replaceChildren(h("div", { class: "dstatus" }, "Loading transcript…"));
  $("d-close").focus();
  const qs = new URLSearchParams(); if (r.origin_id) qs.set("origin", r.origin_id); qs.set("source", r.source);
  try {
    const t = await api(`/v1/sessions/${encodeURIComponent(r.id)}/transcript?${qs}`);
    if (openKey !== key) return;
    const turns = t.turns || [];
    if (!turns.length) { body.replaceChildren(h("div", { class: "dstatus" }, "This transcript has no turns.")); return; }
    body.replaceChildren(...turns.map((tu) => h("div", { class: "turn", "data-role": tu.role },
      h("div", { class: "turn-h" }, h("b", {}, tu.role), tu.timestamp && h("time", { title: absTime(tu.timestamp) }, new Date(tu.timestamp).toLocaleTimeString()),
        tu.model && h("span", {}, tu.model), tu.usage && tu.usage.cost ? h("span", { class: "num" }, money(tu.usage.cost)) : null),
      ...(tu.blocks || []).map(renderBlock))));
    body.scrollTop = body.scrollHeight;
  } catch (err) {
    if (openKey !== key) return;
    body.replaceChildren(h("div", { class: "dstatus err" }, `Could not load the transcript: ${err.message}`));
  }
}
function closeDrawer() {
  if ($("drawer").hidden) return;
  $("drawer").hidden = true; openKey = null;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
$("d-close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
$("d-think").addEventListener("change", (e) => $("d-body").classList.toggle("no-think", !e.target.checked));
$("d-tools").addEventListener("change", (e) => $("d-body").classList.toggle("no-tools", !e.target.checked));

// ---------- boot ----------
api("/v1/healthz").then((hz) => { $("hostinfo").textContent = `${hz.host} · v${hz.version}`; })
  .catch((err) => setConn("down", `API unreachable: ${err.message}`));
connectStream();
loadFleet();
setInterval(() => { if (!rejected) loadFleet(); }, 60000);
setInterval(() => { const q = $("q").value.trim(); if (!rejected && q && !$("q").matches(":focus")) runQuery(); }, 60000);
</script>
</body>
